# ==============================================
# O Encontrei! - Build APK Android (GitHub Actions)
# ==============================================
# Compila o APK automaticamente quando você faz push na branch main.
# O APK fica disponível pra download em Actions > Artifacts.
# ==============================================

name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  build-apk:
    name: 🏗️ Compilar APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: 📦 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Configurar Java (necessário pro Gradle/Android)
      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Configurar Android SDK
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar dependências do frontend
      - name: 📦 Instalar dependências
        working-directory: frontend
        run: npm ci

      # 6. Build de produção do Vite
      - name: 🔨 Build do Frontend
        working-directory: frontend
        run: npm run build

      # 7. Sincronizar com Capacitor
      - name: 📱 Capacitor Sync
        working-directory: frontend
        run: npx cap sync android

      # 8. Tornar gradlew executável
      - name: 🔧 Permissões do Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      # 9. Compilar APK de debug
      - name: 🏗️ Compilar APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      # 10. Upload do APK como artifact
      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: OEncontrei-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
